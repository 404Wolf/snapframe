[package]
name = "snapframe"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "One key for screenshots, GIFs and screen recordings on Wayland"
repository = "https://github.com/404Wolf/snapframe"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
libc = "0.2.191"
notify-rust = "4.18.2"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["xkbcommon"] }
time = { version = "0.3.55", features = ["local-offset", "formatting", "macros"] }
tiny-skia = "0.12.0"
toml = "1.1.8"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wl-clipboard-rs = "0.9.4"

[dev-dependencies]
tempfile = "3.27.0"
